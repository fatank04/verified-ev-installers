services:
  # Static site: free on Render and exempt from the workspace's free *instance*
  # hours, which web services consume. build.py generates every page into public/.
  # No routes/rewrites - Render serves /installers/ohio/ from
  # public/installers/ohio/index.html directly, and a catch-all rewrite would
  # break every subpage.
  - type: web
    name: verified-ev-installers
    runtime: static
    buildCommand: python3 build.py
    staticPublishPath: ./public
    envVars:
      # Where quote requests POST. Set this in the Render dashboard (not here -
      # this repo is public). Example: https://formsubmit.co/ajax/you@example.com
      - key: FORM_ENDPOINT
        sync: false
